data:
    name: homographies
    data_dir: revisitop1m_debug
    image_list: revisitop1m.txt
    train_size: 1
    val_size: 1
    batch_size: 1
    num_workers: 1
    homography:
        difficulty: 0.7
        max_angle: 45
    photometric:
        name: identity
model:
    name: two_view_pipeline
    extractor:
        name: gluefactory_nonfree.superpoint
        max_num_keypoints: 512
        force_num_keypoints: True
        detection_threshold: 0.0
        nms_radius: 3
        trainable: False
    ground_truth:
        name: matchers.homography_matcher
        th_positive: 3
        th_negative: 3
    matcher:
        name: matchers.simpleglue
        # weights: superpoint_lightglue  # This will initalize from ligthglue weights
        # weights: ckpt/sp+sg_homography_initlg_onecyclelr_correctdata/checkpoint_38_45000.tar
        filter_threshold: 0.1
        logvar_filter_threshold: 0
        flash: false
        checkpointed: false
train:
    seed: 0
    epochs: 10000
    log_every_iter: 1
    eval_every_iter: 1
    lr: 1e-4
    clip_grad: 10
    lr_schedule:
        start: 20
        type: OneCycleLR
        options:
            epochs: 40
            steps_per_epoch: 500
            max_lr: 1e-4
            pct_start: 0.1
            anneal_strategy: linear
            cycle_momentum: False
            div_factor: 10
            final_div_factor: 10000
        on_epoch: false
        exp_div_10: 10
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures']
benchmarks:
    hpatches:
      eval:
        estimator: opencv
        ransac_th: 0.5
